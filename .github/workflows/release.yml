name: Release

# Publishes a tagged version's mod zips as GitHub release assets. No tag is created by this
# workflow itself; it only runs once one exists. The NuGet packages are exlib's release, not
# this repository's - it ships no package of its own any more.
on:
  push:
    tags:
      - "v*"

env:
  VS_VERSION: "1.22"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # extools is a private repository while it is still being carved out of this one; the
      # wrappers (scripts/exmod.sh) need its exmod.ps1 to dispatch every command below.
      - name: Checkout extools
        uses: actions/checkout@v4
        with:
          repository: ringavirda/extools
          ref: v0.1.0
          path: extools
          token: ${{ secrets.EXTOOLS_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story install
        uses: actions/cache@v4
        with:
          path: .game
          key: vs-game-${{ env.VS_VERSION }}

      - name: Provision Vintage Story (server assemblies)
        run: bash scripts/exmod.sh provision game -Version "$VS_VERSION" -Kind server

      - name: Restore
        run: dotnet restore VintageStory.sln

      # The same gate every push runs, one more time against the tagged commit - a release never
      # ships a build that hasn't just proven itself.
      - name: Test
        run: bash scripts/exmod.sh test latest

      # Builds every mod for every supported game version and zips them into dist/Releases/.
      - name: Package (mod zips)
        run: bash scripts/exmod.sh pack

      - name: Collect release assets
        run: |
          mkdir -p dist/assets
          find dist/Releases -name '*.zip' -exec cp {} dist/assets/ \;

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/assets/*
          generate_release_notes: true
